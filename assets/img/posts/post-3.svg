<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="Artikel tentang deploy pertama">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F0F14"/>
      <stop offset="1" stop-color="#1C2438"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CFFCB"/>
      <stop offset="1" stop-color="#35C99A"/>
    </linearGradient>
    <pattern id="g" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#7CFFCB" opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1000" height="600" fill="url(#bg)"/>
  <rect width="1000" height="600" fill="url(#g)"/>
  <circle cx="880" cy="480" r="200" fill="#7CFFCB" opacity=".07"/>
  <text x="70" y="90" font-family="'JetBrains Mono',monospace" font-size="12" fill="#7CFFCB" letter-spacing="4">DEV JOURNAL / 011</text>
  <text x="70" y="230" font-family="'Plus Jakarta Sans',system-ui" font-size="58" font-weight="800" fill="#F2F6FF" letter-spacing="-2">Ship it,</text>
  <text x="70" y="298" font-family="'Plus Jakarta Sans',system-ui" font-size="58" font-weight="800" fill="url(#mint)" letter-spacing="-2">then learn.</text>
  <text x="70" y="352" font-family="'Plus Jakarta Sans',system-ui" font-size="14" fill="#8695B4">Checklist kecil sebelum proyek pertama naik ke production.</text>

  <g transform="translate(600 130)">
    <rect x="0" y="0" width="320" height="270" rx="18" fill="#141B2A" stroke="#2B3952"/>
    <rect x="0" y="0" width="320" height="36" rx="18" fill="#101722"/>
    <circle cx="22" cy="18" r="4" fill="#FF7A7A"/><circle cx="38" cy="18" r="4" fill="#FFD37A"/><circle cx="54" cy="18" r="4" fill="#7CFFCB"/>
    <text x="22" y="72" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8695B4">$ git push origin main</text>
    <text x="22" y="100" font-family="'JetBrains Mono',monospace" font-size="11" fill="#7CFFCB">✓ build passed</text>
    <text x="22" y="128" font-family="'JetBrains Mono',monospace" font-size="11" fill="#7CFFCB">✓ database migrated</text>
    <text x="22" y="156" font-family="'JetBrains Mono',monospace" font-size="11" fill="#9AA5FF">→ deploying to production</text>
    <text x="22" y="184" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8695B4">  [████████████] 100%</text>
    <text x="22" y="220" font-family="'JetBrains Mono',monospace" font-size="12" fill="#7CFFCB">deployed in 42s</text>
    <circle cx="285" cy="215" r="22" fill="#7CFFCB" opacity=".12"/>
    <path d="M277 215l6 6 12-14" stroke="#7CFFCB" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <g transform="translate(70 410)">
    <circle cx="0" cy="0" r="6" fill="#7CFFCB"/>
    <text x="18" y="5" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8695B4">backup · https · logging · rollback</text>
  </g>
  <text x="70" y="530" font-family="'JetBrains Mono',monospace" font-size="11" fill="#6B7691">production is where the real learning begins</text>
</svg>
