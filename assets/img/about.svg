<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-label="Ilustrasi ruang kerja">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3EDFF"/>
      <stop offset="1" stop-color="#E4D8FF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6C6FF"/>
      <stop offset="1" stop-color="#C9B8FF"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2B6B"/>
      <stop offset="1" stop-color="#241747"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1430"/>
      <stop offset="1" stop-color="#2B1B5A"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#2B1B5A" opacity=".13"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#2B1B5A" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="900" height="1100" rx="48" fill="url(#wall)"/>
  <rect width="900" height="1100" rx="48" fill="url(#dots)"/>

  <!-- window -->
  <rect x="90" y="90" width="330" height="250" rx="24" fill="url(#glass)"/>
  <path d="M90 200h330M255 90v250" stroke="#FFF" stroke-opacity=".55" stroke-width="8"/>
  <circle cx="180" cy="150" r="26" fill="#FFF" opacity=".5"/>

  <!-- shelf -->
  <rect x="560" y="140" width="270" height="12" rx="6" fill="#2B1B5A" opacity=".65"/>
  <rect x="590" y="72" width="34" height="68" rx="4" fill="#8B6CFF"/>
  <rect x="632" y="86" width="26" height="54" rx="4" fill="#D98E73"/>
  <rect x="666" y="62" width="40" height="78" rx="4" fill="#2B1B5A"/>
  <rect x="714" y="92" width="24" height="48" rx="4" fill="#B7C9A8"/>
  <path d="M770 140c-6-38 14-64 44-70-2 36-18 58-44 70z" fill="#7D9A6B"/>
  <rect x="774" y="140" width="30" height="42" rx="6" fill="#D98E73"/>

  <!-- desk -->
  <rect x="60" y="760" width="780" height="26" rx="13" fill="url(#desk)"/>
  <rect x="120" y="786" width="26" height="220" rx="10" fill="#2B1B5A"/>
  <rect x="754" y="786" width="26" height="220" rx="10" fill="#2B1B5A"/>

  <!-- laptop -->
  <g filter="url(#shadow)">
    <rect x="250" y="430" width="430" height="286" rx="20" fill="url(#screen)"/>
    <rect x="270" y="450" width="390" height="246" rx="12" fill="#0F0F14"/>
    <rect x="270" y="450" width="390" height="30" rx="12" fill="#1F1835"/>
    <circle cx="286" cy="465" r="5" fill="#FF6B6B"/>
    <circle cx="303" cy="465" r="5" fill="#FFD166"/>
    <circle cx="320" cy="465" r="5" fill="#7CFFCB"/>
    <g font-family="'JetBrains Mono',monospace" font-size="13">
      <text x="294" y="512" fill="#8B6CFF">&lt;section class="hero"&gt;</text>
      <text x="314" y="538" fill="#E9E2FF">Building calm products</text>
      <text x="314" y="562" fill="#7CFFCB">with thoughtful code.</text>
      <text x="294" y="590" fill="#8B6CFF">&lt;/section&gt;</text>
      <text x="294" y="622" fill="#6B5B95">// available for work</text>
      <text x="294" y="646" fill="#E9E2FF">const coffee = 3;</text>
    </g>
    <rect x="200" y="716" width="530" height="22" rx="11" fill="#3B2B6B"/>
    <rect x="236" y="738" width="458" height="10" rx="5" fill="#1B1430" opacity=".6"/>
  </g>

  <!-- coffee -->
  <g transform="translate(700 640)">
    <rect x="0" y="20" width="72" height="82" rx="14" fill="#FFF"/>
    <path d="M72 44h18a20 20 0 0 1 0 40H72" fill="none" stroke="#FFF" stroke-width="10"/>
    <rect x="10" y="34" width="52" height="16" rx="8" fill="#8B6CFF" opacity=".25"/>
    <path d="M30 8c-8-12 4-16 0-26M52 8c-8-12 4-16 0-26" stroke="#FFF" stroke-opacity=".65" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- plant -->
  <g transform="translate(125 700)">
    <path d="M66 20C46-38 4-52-8-24c-11 25 31 48 74 44z" fill="#7D9A6B"/>
    <path d="M66 20C94-30 132-32 132-4c0 24-34 36-66 24z" fill="#B7C9A8"/>
    <rect x="38" y="18" width="56" height="66" rx="12" fill="#D98E73"/>
  </g>

  <!-- notes -->
  <g transform="translate(585 380) rotate(7)">
    <rect width="118" height="146" rx="10" fill="#FFF" opacity=".92"/>
    <rect x="18" y="30" width="82" height="6" rx="3" fill="#2B1B5A" opacity=".25"/>
    <rect x="18" y="46" width="58" height="6" rx="3" fill="#2B1B5A" opacity=".18"/>
    <rect x="18" y="72" width="82" height="6" rx="3" fill="#8B6CFF" opacity=".55"/>
    <rect x="18" y="88" width="44" height="6" rx="3" fill="#2B1B5A" opacity=".18"/>
    <circle cx="96" cy="16" r="9" fill="#8B6CFF"/>
  </g>

  <!-- floor lines -->
  <path d="M60 1010c180-46 620-46 780 0" stroke="#2B1B5A" stroke-opacity=".08" stroke-width="18" fill="none"/>

  <text x="70" y="1052" font-family="'JetBrains Mono',monospace" font-size="14" fill="#2B1B5A" opacity=".55">workspace · bandung · 03:17 AM</text>
</svg>
