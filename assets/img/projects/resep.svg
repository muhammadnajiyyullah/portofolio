<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Resep Nusantara interface design">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6EBDD"/>
      <stop offset="1" stop-color="#EFD3C2"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D98E73"/>
      <stop offset="1" stop-color="#B45D3D"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <path d="M0 620C240 560 360 660 600 610s380-90 600-30v170H0z" fill="#D98E73" opacity=".14"/>
  <circle cx="1080" cy="110" r="150" fill="#FFF" opacity=".35"/>

