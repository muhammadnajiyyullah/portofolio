      <rect x="154" y="142" width="118" height="120" rx="14" fill="#DCE6CF"/>
      <circle cx="213" cy="190" r="27" fill="#7D9A6B"/>
      <text x="166" y="244" font-size="10" font-weight="700" fill="#3A2119">Gado-gado</text>
