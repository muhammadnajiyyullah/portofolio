    <text x="44" y="332" font-family="'Plus Jakarta Sans',system-ui" font-size="10" font-weight="700" fill="#8C4B2F">Di balik semangkuk soto</text>
    <text x="44" y="350" font-family="'Plus Jakarta Sans',system-ui" font-size="8" fill="#8C6A5C">Tentang warung, waktu, dan</text>
    <text x="44" y="364" font-family="'Plus Jakarta Sans',system-ui" font-size="8" fill="#8C6A5C">resep yang diwariskan.</text>
    <rect x="28" y="404" width="244" height="1" fill="#EEDFD2"/>
  </g>

  <g transform="translate(800 250)">
