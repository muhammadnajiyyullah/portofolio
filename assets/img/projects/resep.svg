    <text x="0" y="360" font-family="'Plus Jakarta Sans',system-ui" font-size="26" font-weight="800" fill="#3A2119">Aa</text>
    <text x="54" y="352" font-family="'Plus Jakarta Sans',system-ui" font-size="9" fill="#8C6A5C">Jakarta Sans</text>
    <text x="54" y="368" font-family="'JetBrains Mono',monospace" font-size="8" fill="#B08A79">headline / 800</text>
    <text x="150" y="360" font-family="Georgia,serif" font-size="26" fill="#3A2119">Aa</text>
    <text x="198" y="352" font-family="'Plus Jakarta Sans',system-ui" font-size="9" fill="#8C6A5C">Fraunces</text>
    <text x="198" y="368" font-family="'JetBrains Mono',monospace" font-size="8" fill="#B08A79">story / 400</text>
  </g>

  <text x="80" y="710" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8C4B2F" opacity=".6">SUS 86 · 5 USABILITY TESTS · FIGMA / REACT</text>
