<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Raka Pratama — monogram portrait">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE6FF"/>
      <stop offset=".55" stop-color="#D8C9FF"/>
      <stop offset="1" stop-color="#B69BFF"/>
    </linearGradient>
    <linearGradient id="blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B6CFF"/>
      <stop offset="1" stop-color="#2B1B5A"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B1B5A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8B6CFF" stop-opacity=".05"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2B1B5A" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="640" height="640" rx="56" fill="url(#bg)"/>
  <rect width="640" height="640" rx="56" fill="url(#grid)"/>
  <circle cx="492" cy="148" r="96" fill="#FFF" opacity=".5" filter="url(#soft)"/>
  <circle cx="140" cy="520" r="120" fill="#8B6CFF" opacity=".35" filter="url(#soft)"/>

  <g transform="translate(320 318)">
    <circle r="210" fill="none" stroke="url(#ring)" stroke-width="2" stroke-dasharray="3 12"/>
    <circle r="176" fill="none" stroke="#2B1B5A" stroke-opacity=".14" stroke-width="1"/>
    <circle r="142" fill="url(#blob)"/>
    <circle r="142" fill="none" stroke="#FFF" stroke-opacity=".22" stroke-width="1.5"/>
    <text x="0" y="34" text-anchor="middle" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="112" font-weight="800" fill="#F6F1FF" letter-spacing="-6">RP</text>
    <text x="0" y="86" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#D9CCFF" letter-spacing="5">INFO · 2024</text>

    <g transform="translate(-248 -74)">
      <rect x="0" y="0" width="104" height="34" rx="17" fill="#FFF" opacity=".92"/>
      <circle cx="20" cy="17" r="5" fill="#8B6CFF"/>
      <text x="34" y="22" font-family="'JetBrains Mono',monospace" font-size="11" fill="#2B1B5A">web.dev</text>
    </g>
    <g transform="translate(132 104)">
      <rect x="0" y="0" width="120" height="34" rx="17" fill="#2B1B5A"/>
      <text x="18" y="22" font-family="'JetBrains Mono',monospace" font-size="11" fill="#D9CCFF">build( )</text>
    </g>
    <g transform="translate(-170 142)">
      <rect x="0" y="0" width="132" height="34" rx="17" fill="#FFF" opacity=".92"/>
      <text x="18" y="22" font-family="'JetBrains Mono',monospace" font-size="11" fill="#2B1B5A">&lt;hello /&gt;</text>
    </g>
    <circle cx="236" cy="-136" r="7" fill="#7CFFCB"/>
    <circle cx="-224" cy="118" r="5" fill="#8B6CFF"/>
  </g>

  <g font-family="'Plus Jakarta Sans',system-ui,sans-serif">
    <rect x="40" y="40" width="150" height="36" rx="18" fill="#FFF" opacity=".85"/>
    <circle cx="60" cy="58" r="5" fill="#22C55E"/>
    <text x="74" y="63" font-size="12" font-weight="600" fill="#2B1B5A">available</text>
    <text x="40" y="592" font-size="13" font-family="'JetBrains Mono',monospace" fill="#2B1B5A" opacity=".6">[ personal workspace ]</text>
    <text x="600" y="592" text-anchor="end" font-size="13" font-family="'JetBrains Mono',monospace" fill="#2B1B5A" opacity=".6">bdg · id</text>
