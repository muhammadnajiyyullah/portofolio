<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Lumina learning dashboard preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFE9FF"/>
      <stop offset="1" stop-color="#CDBBFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B6CFF"/>
      <stop offset="1" stop-color="#6C4DE6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#2B1B5A" flood-opacity=".22"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2B1B5A" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <circle cx="1080" cy="120" r="150" fill="#FFF" opacity=".35"/>
  <circle cx="120" cy="660" r="180" fill="#8B6CFF" opacity=".22"/>

  <g filter="url(#sh)">
    <rect x="150" y="95" width="900" height="580" rx="28" fill="#FBF9FF"/>
    <rect x="150" y="95" width="900" height="56" rx="28" fill="#FFF"/>
    <rect x="150" y="123" width="900" height="28" fill="#FFF"/>
    <circle cx="186" cy="123" r="6" fill="#FF8A8A"/>
    <circle cx="206" cy="123" r="6" fill="#FFD37A"/>
    <circle cx="226" cy="123" r="6" fill="#7CFFCB"/>
    <rect x="300" y="112" width="300" height="22" rx="11" fill="#F1ECFF"/>
    <text x="316" y="127" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8B7DB5">lumina.app/dashboard</text>

    <!-- sidebar -->
    <rect x="150" y="151" width="190" height="524" fill="#F4F0FF"/>
    <rect x="178" y="184" width="42" height="42" rx="12" fill="url(#accent)"/>
    <text x="190" y="212" font-family="'Plus Jakarta Sans',system-ui" font-size="17" font-weight="800" fill="#FFF">L</text>
    <text x="232" y="211" font-family="'Plus Jakarta Sans',system-ui" font-size="16" font-weight="700" fill="#2B1B5A">Lumina</text>
    <g font-family="'Plus Jakarta Sans',system-ui" font-size="12" fill="#6B5B95">
      <rect x="174" y="252" width="142" height="34" rx="9" fill="#FFF"/>
      <text x="196" y="273" fill="#2B1B5A" font-weight="600">Dashboard</text>
      <text x="196" y="313">My Classes</text>
      <text x="196" y="349">Assignments</text>
      <text x="196" y="385">Calendar</text>
      <text x="196" y="421">Notes</text>
    </g>
    <rect x="174" y="596" width="142" height="52" rx="12" fill="#FFF"/>
    <circle cx="196" cy="622" r="12" fill="#C9B8FF"/>
    <rect x="216" y="612" width="62" height="7" rx="3.5" fill="#2B1B5A" opacity=".6"/>
    <rect x="216" y="626" width="42" height="6" rx="3" fill="#2B1B5A" opacity=".25"/>

    <!-- content -->
    <text x="378" y="198" font-family="'Plus Jakarta Sans',system-ui" font-size="25" font-weight="800" fill="#2B1B5A">Good evening, Raka</text>
    <text x="378" y="222" font-family="'Plus Jakarta Sans',system-ui" font-size="12" fill="#7B6FA0">You have 3 tasks due this week. Keep the momentum.</text>
    <rect x="862" y="178" width="44" height="44" rx="12" fill="#F0EAFF"/>
    <circle cx="884" cy="200" r="9" fill="#8B6CFF"/>

    <!-- progress card -->
    <rect x="378" y="252" width="318" height="164" rx="18" fill="url(#accent)"/>
    <text x="402" y="286" font-family="'Plus Jakarta Sans',system-ui" font-size="11" fill="#E3D9FF" letter-spacing="1.6">WEEKLY PROGRESS</text>
    <text x="402" y="336" font-family="'Plus Jakarta Sans',system-ui" font-size="44" font-weight="800" fill="#FFF">78%</text>
    <text x="402" y="362" font-family="'Plus Jakarta Sans',system-ui" font-size="11" fill="#D9CCFF">12 of 16 lessons completed</text>
    <rect x="402" y="378" width="270" height="8" rx="4" fill="#FFF" opacity=".22"/>
    <rect x="402" y="378" width="211" height="8" rx="4" fill="#7CFFCB"/>
    <g stroke="#FFF" stroke-width="2" fill="none" opacity=".5">
      <path d="M594 292l10-10 12 14 14-22 16 12 14-20"/>
    </g>

    <!-- next class -->
    <rect x="716" y="252" width="306" height="164" rx="18" fill="#FFF" stroke="#E9E1FF"/>
    <text x="740" y="284" font-family="'Plus Jakarta Sans',system-ui" font-size="11" fill="#8B7DB5" letter-spacing="1.6">UP NEXT</text>
    <text x="740" y="318" font-family="'Plus Jakarta Sans',system-ui" font-size="18" font-weight="700" fill="#2B1B5A">Human–Computer</text>
    <text x="740" y="340" font-family="'Plus Jakarta Sans',system-ui" font-size="18" font-weight="700" fill="#2B1B5A">Interaction</text>
    <text x="740" y="370" font-family="'Plus Jakarta Sans',system-ui" font-size="11" fill="#7B6FA0">Today · 19.00 · Room 4B</text>
    <rect x="740" y="384" width="98" height="24" rx="12" fill="#F0EAFF"/>
    <text x="758" y="400" font-family="'Plus Jakarta Sans',system-ui" font-size="10" font-weight="600" fill="#6C4DE6">Join class</text>
    <circle cx="974" cy="308" r="28" fill="#F4F0FF"/>
    <circle cx="974" cy="308" r="18" fill="#C9B8FF"/>

    <!-- courses -->
    <text x="378" y="456" font-family="'Plus Jakarta Sans',system-ui" font-size="15" font-weight="700" fill="#2B1B5A">Continue learning</text>
    <text x="940" y="456" text-anchor="end" font-family="'Plus Jakarta Sans',system-ui" font-size="11" fill="#8B6CFF">View all</text>
    <g font-family="'Plus Jakarta Sans',system-ui">
      <rect x="378" y="474" width="210" height="176" rx="16" fill="#FFF" stroke="#EEE8FF"/>
      <rect x="392" y="488" width="182" height="82" rx="10" fill="#DED2FF"/>
      <circle cx="426" cy="522" r="14" fill="#8B6CFF"/>
      <path d="M422 516l12 6-12 6z" fill="#FFF"/>
      <text x="392" y="596" font-size="12" font-weight="700" fill="#2B1B5A">Algorithms</text>
      <text x="392" y="614" font-size="10" fill="#8B7DB5">Module 4 · Sorting</text>
      <rect x="392" y="626" width="182" height="6" rx="3" fill="#F1ECFF"/>
      <rect x="392" y="626" width="124" height="6" rx="3" fill="#8B6CFF"/>

      <rect x="606" y="474" width="210" height="176" rx="16" fill="#FFF" stroke="#EEE8FF"/>
      <rect x="620" y="488" width="182" height="82" rx="10" fill="#FFE3D6"/>
      <circle cx="654" cy="522" r="14" fill="#D98E73"/>
      <path d="M650 516l12 6-12 6z" fill="#FFF"/>
      <text x="620" y="596" font-size="12" font-weight="700" fill="#2B1B5A">UI Engineering</text>
      <text x="620" y="614" font-size="10" fill="#8B7DB5">Module 2 · Design system</text>
      <rect x="620" y="626" width="182" height="6" rx="3" fill="#F1ECFF"/>
      <rect x="620" y="626" width="76" height="6" rx="3" fill="#D98E73"/>

      <rect x="834" y="474" width="188" height="176" rx="16" fill="#FFF" stroke="#EEE8FF"/>
      <rect x="848" y="488" width="160" height="82" rx="10" fill="#D8F5E6"/>
      <circle cx="880" cy="522" r="14" fill="#4FB783"/>
      <path d="M876 516l12 6-12 6z" fill="#FFF"/>
      <text x="848" y="596" font-size="12" font-weight="700" fill="#2B1B5A">Databases</text>
      <text x="848" y="614" font-size="10" fill="#8B7DB5">Module 1 · Normalization</text>
      <rect x="848" y="626" width="160" height="6" rx="3" fill="#F1ECFF"/>
      <rect x="848" y="626" width="144" height="6" rx="3" fill="#4FB783"/>
    </g>
  </g>

  <text x="70" y="700" font-family="'JetBrains Mono',monospace" font-size="12" fill="#2B1B5A" opacity=".5">LUMINA — LMS / 2024</text>
  <circle cx="1120" cy="700" r="4" fill="#8B6CFF"/>
</svg>
